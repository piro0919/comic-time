# マイグレーションの危ない書き方を、コミットの時点で止める（vocafy の .squawk.toml と同じ考え）。
# 本番の DB へは npm run migrate で手で当てるので、止める場所はここしかない。
# 止めるのは、表や列の削除、名前や型の変更、既存の列を空欄禁止にする、のような、当てたら
# 戻せない・古い版のコードが落ちる変更。二度に分けて出す（まず使うのをやめ、次の配備で消す）。
# 本当に消すときは、その文の上に `-- squawk-ignore ban-drop-column` のように書く
assume_in_transaction = true
excluded_rules = [
  # 表は小さい（利用者とフォローで数千行）。ロックの待ちと時間切れを気にする大きさではない
  "require-lock-timeout",
  "require-statement-timeout",
  "require-concurrent-index-creation",
  "constraint-missing-not-valid",
  "adding-foreign-key-constraint",
]
