pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "**/*.{ts,tsx}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: "**/*"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    secretlint:
      glob: "**/*"
      run: npx secretlint --maskSecrets {staged_files}
    stylelint:
      glob: "**/*.css"
      run: npx stylelint --fix {staged_files}
      stage_fixed: true
    test:
      run: npm test
    typescript:
      run: npx tsc --noEmit
    # 足したマイグレーションの危ない書き方（表や列の削除、型の変更など）を止める（.squawk.toml）
    squawk:
      glob: "db/migrations/*.sql"
      run: npx squawk {staged_files}
  scripts:
    # 一度コミットしたマイグレーションの書き換えと削除を止める
    "migrations.sh":
      runner: bash
commit-msg:
  scripts:
    "commitlint.sh":
      runner: bash
