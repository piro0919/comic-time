name: scrape

on:
  schedule:
    # 日本時間 0:30 / 6:30 / 12:30 / 18:30。0時・11時・12時・17時の更新をその直後に拾う
    #
    # ここは保険。GitHub のスケジュールは混雑すると数時間遅れ、枠ごと落ちる日もある。
    # 時刻どおりの起動は cron-job.org から workflow_dispatch を叩いて作っていて、
    # そちらが日本時間の 0:05 / 6:05 / 12:05 / 18:05 に走る。
    # 二重に走っても取得結果が同じなら差分が出ず、コミットは起きない
    - cron: "30 15 * * *"
    - cron: "30 21 * * *"
    - cron: "30 3 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      # 取れなかったサイトはその日を空にしたうえで、異常終了する
      - run: npm run scrape
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "chore(data): update works"
          git push
