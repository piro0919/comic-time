name: scrape

on:
  schedule:
    # 日本時間 1:00 / 13:00 / 19:00。0時更新と12時更新の両方を当日中に拾う
    - cron: "0 16 * * *"
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      # 取得できなかったサイトがあると異常終了する。データは据え置かれる
      - run: npm run scrape
      - run: npm run scrape:ogp
        if: always()
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "chore(data): update works"
          git push
